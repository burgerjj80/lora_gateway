services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: garmin_bridge
    ports:
      - "5432:5432"
    volumes:
      - garmin_bridge_pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  garmin_bridge_pg:
